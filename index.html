<!DOCTYPE html>
<!-- Documento HTML5; el idioma se establece en español para lectores de pantalla y navegadores. -->
<html lang="es">

<head>
    <!-- Define la codificación para mostrar correctamente caracteres y acentos. -->
    <meta charset="UTF-8">
    <!-- Ajusta la escala y el ancho de la página a pantallas móviles. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Carga Bootstrap para usar sus estilos base en controles y componentes. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Carga los estilos propios del proyecto después de Bootstrap para poder personalizarlos. -->
    <link rel="stylesheet" href="assets/CSS/style.css">
    <!-- Texto que aparece en la pestaña del navegador. -->
    <title>Magic Api</title>
</head>

<body>
    <!-- Encabezado principal de la página. -->
    <h1>Magic: The Gathering</h1>
    <!-- Contenido principal de controles de la página. -->
    <main>
        <!-- Agrupa los controles para filtrar las cartas por tipo. -->
        <section id="filter" class="filter">
            <!-- Select oculto que conserva los valores y sincroniza el filtro con JavaScript. -->
            <select class="form-select form-select-sm" aria-label="Filter cards by type" hidden>
                <!-- Opción predeterminada que muestra todas las cartas. -->
                <option value="All" selected>All Types</option>
                <!-- Filtra las cartas de tipo criatura. -->
                <option value="Creature">Creature</option>
                <!-- Filtra las cartas de tipo encantamiento. -->
                <option value="Enchantment">Enchantment</option>
                <!-- Filtra las cartas de tipo instantáneo. -->
                <option value="Instant">Instant</option>
                <!-- Filtra las cartas de tipo conjuro. -->
                <option value="Sorcery">Sorcery</option>
            </select>
            <!-- Botón visible que abre el menú personalizado en lugar del desplegable nativo. -->
            <button class="filter-toggle" type="button" role="combobox" aria-label="Filter cards by type"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="filter-options">
                <!-- Muestra la categoría seleccionada inicialmente. -->
                All Types
            </button>
            <!-- JavaScript crea aquí las opciones con la tipografía personalizada. -->
            <div class="filter-options" id="filter-options" role="listbox" aria-label="Card types" hidden></div>
        </section>
    </main>
    <!-- Contenedor vacío donde JavaScript inserta las tarjetas obtenidas de la API. -->
    <section class="cards" aria-label="Magic: The Gathering cards"></section>
    <!-- Carga la lógica del filtro, la petición a la API y el renderizado de cartas. -->
    <script src="assets/JS/script.js"></script>
    <!-- Carga componentes de Bootstrap; integrity valida el archivo y crossorigin limita el envío de referencia. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>

</body>

</html>
